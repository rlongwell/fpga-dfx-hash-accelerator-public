<text x="283" y="212" fill="#aabbd1" font-size="14" font-weight="400" text-anchor="start">Static ARM + peripherals</text>
<rect x="595" y="157" width="300" height="427" rx="14" fill="#142238" stroke="#70d9e9" />
<text x="613" y="188" fill="#70d9e9" font-size="14" font-weight="700" text-anchor="start">STATIC LOGIC</text>
<text x="613" y="212" fill="#aabbd1" font-size="14" font-weight="400" text-anchor="start">DMA + control + isolation</text>
<rect x="935" y="157" width="305" height="427" rx="14" fill="#142238" stroke="#c0a2ff" stroke-dasharray="7 5"/>
<text x="953" y="188" fill="#c0a2ff" font-size="14" font-weight="700" text-anchor="start">RECONFIGURABLE</text>
<text x="953" y="212" fill="#aabbd1" font-size="14" font-weight="400" text-anchor="start">u_hash partition</text>
