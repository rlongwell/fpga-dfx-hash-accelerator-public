<text x="40" y="91" fill="#f4f8ff" font-size="31" font-weight="700" text-anchor="start">Three algorithms. One reconfigurable region.</text>
<text x="40" y="122" fill="#aabbd1" font-size="16" font-weight="400" text-anchor="start">Zybo Z7-20  /  Zynq-7020  /  64-bit AXI Stream  /  100 MHz PL clock</text>
