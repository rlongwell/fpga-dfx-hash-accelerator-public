<text x="615" y="620" fill="#c0a2ff" font-size="15" font-weight="500" text-anchor="middle">PCAP · compatible partial image · between files</text>
<text x="40" y="672" fill="#70d9e9" font-size="12" font-weight="700" text-anchor="start">ENGINEERING FOCUS</text>
<text x="235" y="672" fill="#dbe6f5" font-size="16" font-weight="400" text-anchor="start">Length-aware streaming   /   Fail-closed isolation   /   Reused static routing</text>
