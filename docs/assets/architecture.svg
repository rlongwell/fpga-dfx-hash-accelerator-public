<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">FPGA DFX hash accelerator architecture</title><desc id="desc">A host sends files to the Zynq processing system. Linux buffers chunks in DDR; AXI DMA feeds a static framing and isolation shell, which connects to one loaded hash engine. PCAP replaces the engine between files. The digest is captured in static registers.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70d9e9"/></marker>
  <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0a2ff"/></marker>
</defs>
<rect width="1280" height="720" rx="20" fill="url(#bg)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
