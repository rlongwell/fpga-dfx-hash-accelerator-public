<title id="title">Routed resource usage for three compatible DFX configurations</title><desc id="desc">Stacked bars show static and reconfigurable partition LUT counts from retained Vivado 2024.2 routed reports. SHA3 uses 7193 total LUTs, SHA-256 3953, and BLAKE2s 6338. All meet 100 MHz setup timing. These are implementation results, not board measurements.</desc>
