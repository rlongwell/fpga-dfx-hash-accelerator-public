image boot.vfat {
    vfat {
        files = { "BOOT.BIN", "u-boot.img", "boot.scr", "system.bit", "system.dtb", "zImage" }
    }
    size = 64M
}
image sdcard.img {
    hdimage { }
    partition boot {
        partition-type = 0x0C
        bootable = true
        image = "boot.vfat"
        offset = 1M
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
